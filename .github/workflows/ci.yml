name: CI

on:
  push:
    branches: [ main, master, develop, security-improvements ]
  pull_request:
    branches: [ main, master, develop, security-improvements ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: pdo, pdo_sqlite, pdo_mysql
        ini-values: error_reporting=E_ALL

    - name: Install PHPUnit
      run: |
        wget -O phpunit.phar https://phar.phpunit.de/phpunit-9.phar
        chmod +x phpunit.phar

    - name: Create test reports directory
      run: mkdir -p tests/reports

    - name: Run PHPUnit tests
      run: php phpunit.phar --configuration=tests/phpunit.xml --log-junit=tests/reports/junit.xml --testdox --verbose

    - name: Upload test results
      uses: dorny/test-reporter@v1
      if: success() || failure()
      with:
        name: PHPUnit Tests
        path: tests/reports/junit.xml
        reporter: java-junit
        fail-on-error: true